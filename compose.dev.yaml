# Development services only. Production uses a separate, hardened Compose
# file (Phase 9).
#
# PostgreSQL is published on 127.0.0.1 only, so the API and tests running on
# this workstation can reach it while other machines on the network cannot.
# Production never publishes the database port.
#
# Create the secrets first: `npm run setup:dev`.
name: lexora-dev

services:
  db:
    # PostgreSQL 18.6, pinned by digest so the image cannot change silently.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_superuser_password
      - lexora_owner_password
      - lexora_app_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    # Healthy only when initialisation has really finished: the server accepts
    # TCP connections (which it does not do during initialisation) AND both
    # Lexora roles and the test database exist. `pg_isready` alone reports
    # healthy even when initialisation failed and the roles are missing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$(cat /run/secrets/postgres_superuser_password)"
          psql -h 127.0.0.1 -U postgres -d lexora_test -tAc
          "SELECT count(*) FROM pg_roles WHERE rolname IN ('lexora_owner', 'lexora_app')"
          | grep -qx 2
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Malware scanner (ClamAV clamd). Opt-in, because it needs 1–2 GB of memory:
  # `npm run scanner:up`. While it is down, the API refuses every upload.
  # ClamAV 1.5.4 (released 2026-08-07); the image is rebuilt with new
  # signatures every few days, and freshclam keeps them current while it runs.
  clamav:
    image: clamav/clamav:1.5.4@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    profiles: [scanner]
    environment:
      # Accept streams up to the API's largest upload (100 MB ceiling) and
      # halve peak memory by not loading a second database during updates.
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      # CI sets this to true: the image's bundled signatures are enough there.
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "127.0.0.1:53310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  lexora_owner_password:
    file: ./secrets/lexora_owner_password
  lexora_app_password:
    file: ./secrets/lexora_app_password

volumes:
  pgdata:
  clamav-db:
